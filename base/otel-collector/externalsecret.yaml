apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-collector-nats-creds
  namespace: otel-collector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm-cluster-store
  target:
    name: otel-collector-nats-creds
    creationPolicy: Owner
  data:
    # Reuses the existing admin creds for the demo. For a tighter setup, mint a
    # dedicated collector user (pub/sub on otel_test + JS on OTEL_TEST), upload
    # it to GCP Secret Manager, and point remoteRef.key at that instead.
    - secretKey: collector.creds
      remoteRef:
        key: orders-admin-creds
