apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-ingress-nginx'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: ingress-nginx
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: 4.15.1
        helm:
          valuesObject:
            controller:
              resources:
                requests:
                  cpu: 100m
                  memory: 90Mi
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-cert-manager'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: cert-manager
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.15.1
        helm:
          valuesObject:
            installCRDs: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            serviceAccount:
              annotations:
                iam.gke.io/gcp-service-account: external-dns@{{.gcp.project}}.iam.gserviceaccount.com
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-issuers
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-cert-manager-issuers'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: cert-manager
      source:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        targetRevision: main
        path: base/cert-manager
        kustomize:
          patches:
            - target:
                kind: ClusterIssuer
                name: letsencrypt-prod
              patch: |
                - op: replace
                  path: /spec/acme/email
                  value: '{{.certManager.email}}'
                - op: replace
                  path: /spec/acme/solvers/0/dns01/cloudDNS/project
                  value: '{{.gcp.project}}'
            - target:
                kind: ClusterIssuer
                name: letsencrypt-staging
              patch: |
                - op: replace
                  path: /spec/acme/email
                  value: '{{.certManager.email}}'
                - op: replace
                  path: /spec/acme/solvers/0/dns01/cloudDNS/project
                  value: '{{.gcp.project}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-external-secrets'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: external-secrets
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 0.20.4
        helm:
          valuesObject:
            installCRDs: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # external-secrets v0.20 CRD schemas exceed the 256KB
          # last-applied-configuration annotation limit; client-side apply
          # can't even create secretstores/clustersecretstores. SSA avoids
          # the annotation entirely.
          - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-stores
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-external-secrets-stores'
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: external-secrets
      source:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        targetRevision: main
        path: base/external-secrets
        kustomize:
          patches:
            - target:
                kind: ClusterSecretStore
                name: gcpsm-cluster-store
              patch: |
                - op: replace
                  path: /spec/provider/gcpsm/projectID
                  value: '{{.gcp.project}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/suckatrash/nats-argocd-stack.git
        revision: main
        files:
          - path: "clusters/*/config.yaml"
  template:
    metadata:
      name: '{{.cluster.name}}-external-dns'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      destination:
        server: '{{.cluster.server}}'
        namespace: external-dns
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: 1.21.1
        helm:
          valuesObject:
            provider: google
            google:
              project: '{{.gcp.project}}'
              serviceAccountSecret: ""
            domainFilters:
              - '{{.dns.baseDomain}}'
            txtOwnerId: "external-dns"
            txtPrefix: "_external-dns."
            sources:
              - ingress
              - service
            policy: sync
            interval: 1m
            logLevel: info
            registry: txt
            serviceAccount:
              create: true
              annotations:
                iam.gke.io/gcp-service-account: 'external-dns@{{.gcp.project}}.iam.gserviceaccount.com'
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
            extraArgs:
              - --google-zone-visibility=public
              - '--zone-id-filter={{.dns.zoneName}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
