apiVersion: v1
kind: ConfigMap
metadata:
  name: insights-config
  namespace: insights
data:
  insights.yaml: |
    nats:
      url: nats://nats1.gcp.iamusingtheinternet.com:4222
      creds: /etc/insights/creds/sys.creds
    sys:
      server: nats://nats1.gcp.iamusingtheinternet.com:4222
      creds: /etc/insights/creds/sys.creds
    data-dir: /data
    scraper:
      interval: 10s
    log-level: debug
