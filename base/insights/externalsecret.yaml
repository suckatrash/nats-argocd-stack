apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: insights-nats-creds
  namespace: insights
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm-cluster-store
  target:
    name: insights-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: sys.creds
      remoteRef:
        key: insights-sys-creds
    - secretKey: sink.creds
      remoteRef:
        key: insights-sink-creds
    # Web session-seed. The chart injects this as INSIGHTS_WEB_SESSION_SEED via
    # sessionSeed.existingSecret, keeping the seed out of git.
    - secretKey: seed
      remoteRef:
        key: insights-web-session-seed
