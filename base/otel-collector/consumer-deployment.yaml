apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-consumer
  namespace: otel-collector
  labels:
    app: otel-collector-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-consumer
  template:
    metadata:
      labels:
        app: otel-collector-consumer
    spec:
      containers:
        - name: otel-collector
          # Contrib test image (deploy/otelcol-contrib), the same one as the
          # producer. Pinned here because the ApplicationSet only patches the
          # otel-collector producer; keep it in sync with
          # clusters/minimal/config.yaml (apps.otelCollector.image).
          image: us-central1-docker.pkg.dev/erik-sandbox-408216/insights/otelcol-nats:nats-contrib-20261026150353
          args: ["--config", "/etc/otelcol/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: nats-creds
              mountPath: /etc/nats/creds
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-consumer-config
        - name: nats-creds
          secret:
            secretName: otel-collector-nats-creds
