apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-consumer-config
  namespace: otel-collector
data:
  config.yaml: |
    # Consumer side of the split pipeline (contrib nats receiver):
    #
    #   nats receiver (core NATS on otel_test) -> batch -> otlp -> Jaeger
    #
    # The producer (otel-collector, contrib nats exporter) publishes OTLP-proto
    # to subject otel_test and this receiver subscribes to it. Both run the same
    # contrib test image. The contrib receiver is core NATS only for now
    # (at-most-once): traces published while this pod is down are not replayed,
    # though the OTEL_TEST stream still captures them for inspection.
    receivers:
      nats:
        endpoint: tls://nats1.gcp.iamusingtheinternet.com:4222
        auth:
          nkey_user_file:
            user_file: /etc/nats/creds/collector.creds
        traces:
          subject: otel_test
          encoding: otlp_proto

    exporters:
      otlp/jaeger:
        endpoint: jaeger.jaeger.svc.cluster.local:4317
        tls:
          insecure: true

    processors:
      batch: {}

    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [nats]
          processors: [batch]
          exporters: [otlp/jaeger]
