# ocb manifest for a test image of the CONTRIB NATS exporter and receiver.
#
# Components: otlp + nats (contrib) receivers -> batch -> nats (contrib), otlp,
# and debug exporters. The NATS components and the contrib modules they depend
# on carry local (unreleased) changes, so they are replaced with the working
# copies in the contrib checkout.
#
# The replace paths below are ABSOLUTE and machine-specific — they must point at
# your opentelemetry-collector-contrib checkout. build.sh defaults to
# /Users/erik/projects/opentelemetry-collector-contrib; edit both if yours
# differs. Collector component versions (and the ocb version in build.sh) must
# match the NATS components' collector dependency (currently v0.164.0 / v1.70.0).
dist:
  name: otelcol-nats-contrib
  description: OTel Collector with the contrib NATS exporter and receiver (test build)
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/natsreceiver v0.164.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/natsexporter v0.164.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/natsexporter => /Users/erik/projects/opentelemetry-collector-contrib/exporter/natsexporter
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/natsreceiver => /Users/erik/projects/opentelemetry-collector-contrib/receiver/natsreceiver
  - github.com/open-telemetry/opentelemetry-collector-contrib/internal/natsclient => /Users/erik/projects/opentelemetry-collector-contrib/internal/natsclient
  - github.com/open-telemetry/opentelemetry-collector-contrib/internal/sharedcomponent => /Users/erik/projects/opentelemetry-collector-contrib/internal/sharedcomponent
  - github.com/open-telemetry/opentelemetry-collector-contrib/internal/common => /Users/erik/projects/opentelemetry-collector-contrib/internal/common
  - github.com/open-telemetry/opentelemetry-collector-contrib/internal/coreinternal => /Users/erik/projects/opentelemetry-collector-contrib/internal/coreinternal
  - github.com/open-telemetry/opentelemetry-collector-contrib/pkg/ottl => /Users/erik/projects/opentelemetry-collector-contrib/pkg/ottl
