apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pyroscope-creds
  namespace: nats
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm-cluster-store
  target:
    name: pyroscope-creds
    creationPolicy: Owner
  data:
    # Pyroscope basic-auth token, injected into nats-server as
    # PYROSCOPE_BASIC_AUTH_PASSWORD (see the nats Helm values in
    # argocd/applicationsets/applications.yaml).
    - secretKey: password
      remoteRef:
        key: pyroscope-token
