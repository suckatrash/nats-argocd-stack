apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          # Custom ocb-built image with the natscore components (see the
          # opentelemetry-collector-nats repo, deploy/). Patched from
          # apps.otelCollector.image by the ApplicationSet.
          image: PLACEHOLDER
          args: ["--config", "/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: nats-creds
              mountPath: /etc/nats/creds
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # Sized for a tight cluster + this demo's low trace volume; requests
            # kept small so the pod schedules on an already-full node.
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: nats-creds
          secret:
            secretName: otel-collector-nats-creds
