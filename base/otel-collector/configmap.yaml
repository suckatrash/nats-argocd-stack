apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-collector
data:
  config.yaml: |
    # Two trace pipelines:
    #   produce:  OTLP from apps -> natscore exporter -> JetStream OTEL_TEST
    #   consume:  natscore receiver (durable) -> Jaeger (OTLP)
    #
    # Connects to the cluster NATS over the external LB endpoint so the server's
    # Let's Encrypt cert (CN nats1.gcp...) verifies against system roots — the
    # same way the order-pipeline connects. JetStream domain is test01.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      natscore:
        endpoint: tls://nats1.gcp.iamusingtheinternet.com:4222
        nkey_user_file:
          user_file: /etc/nats/creds/collector.creds
        jetstream:
          domain: test01
          ack_wait: 30s
          max_deliver: 5
        traces:
          subject: otel_test
          encoding: otlp_proto
          stream: OTEL_TEST
          durable: otel_test_consumer

    exporters:
      natscore:
        endpoint: tls://nats1.gcp.iamusingtheinternet.com:4222
        nkey_user_file:
          user_file: /etc/nats/creds/collector.creds
        jetstream:
          domain: test01
        traces:
          subject: '"otel_test"'      # OTTL literal (exporter side) — inner quotes required
          marshaler: otlp_proto
      otlp/jaeger:
        endpoint: jaeger.jaeger.svc.cluster.local:4317
        tls:
          insecure: true

    processors:
      batch: {}

    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces/produce:
          receivers: [otlp]
          processors: [batch]
          exporters: [natscore]
        traces/consume:
          receivers: [natscore]
          processors: [batch]
          exporters: [otlp/jaeger]
