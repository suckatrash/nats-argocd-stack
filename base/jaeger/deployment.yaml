apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          # all-in-one: collector + query + UI with in-memory storage. Public
          # image; fine for a demo/lab (traces are not persisted across restarts).
          image: jaegertracing/all-in-one:1.62.0
          env:
            # Accept OTLP on 4317 (gRPC) / 4318 (HTTP) — the collector exports here.
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
            # In-memory storage is unbounded by default and OOM-kills under load.
            # Cap the retained traces so memory stays flat (demo keeps recent ones).
            - name: MEMORY_MAX_TRACES
              value: "20000"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Trimmed requests so it schedules on a tight cluster; in-memory
            # storage with this demo's low trace volume stays well under the limit.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
