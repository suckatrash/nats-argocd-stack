apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-collector
data:
  config.yaml: |
    # Test config for the contrib NATS exporter (core NATS publish path).
    #
    #   otlp (from apps) -> batch -> nats exporter -> subject otel_test
    #
    # The contrib exporter publishes with core NATS (fire-and-forget, no
    # JetStream block). The OTEL_TEST JetStream stream captures core publishes
    # to its subject (otel_test), so delivery is verifiable with
    # `nats stream info OTEL_TEST`. Connects over the external LB endpoint so the
    # server's Let's Encrypt cert (CN nats1.gcp...) verifies against system roots.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      nats:
        endpoint: tls://nats1.gcp.iamusingtheinternet.com:4222
        auth:
          nkey_user_file:
            user_file: /etc/nats/creds/collector.creds
        traces:
          subject: '"otel_test"'      # OTTL literal — inner quotes required
          marshaler: otlp_proto
      debug:
        verbosity: normal

    processors:
      batch: {}

    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [nats, debug]
